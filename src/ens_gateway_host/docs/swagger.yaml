basePath: /
definitions:
  errors.InternalError:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  errors.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
  requests.ResolveOffchainQueryRequest:
    properties:
      data:
        type: string
      sender:
        type: string
    type: object
  responses.CcipReadResponse:
    properties:
      data:
        type: string
    type: object
  responses.GetHealthResponse:
    properties:
      status:
        type: string
    type: object
info:
  contact: {}
  description: ERC-3668 / CCIP-Read gateway for agent ENS records.
  title: Agentic ENS Gateway API
  version: "1.0"
paths:
  /{sender}:
    post:
      consumes:
      - application/json
      parameters:
      - description: L1 resolver address
        in: path
        name: sender
        required: true
        type: string
      - description: resolver call data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/requests.ResolveOffchainQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.CcipReadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.InternalError'
      summary: CCIP-Read gateway (POST)
      tags:
      - CCIP-Read
  /{sender}/{data}:
    get:
      parameters:
      - description: L1 resolver address
        in: path
        name: sender
        required: true
        type: string
      - description: 0x-hex resolver call data (optional `.json` suffix)
        in: path
        name: data
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.CcipReadResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errors.ValidationError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/errors.InternalError'
      summary: CCIP-Read gateway (GET)
      tags:
      - CCIP-Read
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/responses.GetHealthResponse'
      summary: Health check
      tags:
      - Health
swagger: "2.0"
