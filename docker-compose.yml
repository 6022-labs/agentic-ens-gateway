services:
  ens-gateway:
    build:
      context: .
      dockerfile: src/ens_gateway_host/Dockerfile
    env_file:
      - src/ens_gateway_host/.env
    environment:
      - TELEMETRY__ENABLED=true
      - TELEMETRY__ENDPOINT=ens-gateway-alloy:4317
      - TELEMETRY__INSECURE=true
      - TELEMETRY__INSTANCE_ID=local-dev
      - TELEMETRY__ENVIRONMENT=local
      # A token means bearer, a username + password means basic; setting both is fatal.
      # - TELEMETRY__AUTH_TOKEN=shared-secret
      # - TELEMETRY__AUTH_USERNAME=ingest-user
      # - TELEMETRY__AUTH_PASSWORD=secret
    ports:
      - "5000:5000"
    depends_on:
      - redis

  redis:
    image: "redis:8-alpine"
    ports:
      - "6379:6379"

  # Observability stack: Alloy (OTLP) -> Mimir + Loki + Tempo, shown in Grafana.
  ens-gateway-alloy:
    build: ./grafana/alloy
    container_name: ens-gateway-alloy
    environment:
      - LOKI_URL=http://ens-gateway-loki:3100
      - MIMIR_URL=http://ens-gateway-mimir:9009
      - TEMPO_OTLP_URL=http://ens-gateway-tempo:4318
      # Ingest auth is off by default. htpasswd (one credential per sender, `$` escaped as `$$`)
      # wins over token (one shared by every sender).
      # - OTLP_AUTH_HTPASSWD=ingest-user:secret
      # - OTLP_AUTH_TOKEN=shared-secret
      # - OTLP_TLS_CERT_FILE=/certs/alloy.crt
      # - OTLP_TLS_KEY_FILE=/certs/alloy.key
      # - OTLP_TLS_CLIENT_CA_FILE=/certs/ca.crt
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP

  ens-gateway-mimir:
    image: "grafana/mimir:3.2.0"
    container_name: ens-gateway-mimir
    command: ["--config.file=/etc/mimir/mimir.yml", "--target=all"]
    volumes:
      - ./grafana/mimir/mimir-config.yaml:/etc/mimir/mimir.yml
      - ens-gateway-mimir-data:/mimir-data
    ports:
      - "9009:9009"

  ens-gateway-loki:
    image: "grafana/loki:3.7.6"
    container_name: ens-gateway-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./grafana/loki/loki-config.yaml:/etc/loki/loki.yaml
      - ens-gateway-loki-data:/loki
    ports:
      - "3100:3100"

  ens-gateway-tempo:
    image: "grafana/tempo:3.0.3"
    container_name: ens-gateway-tempo
    depends_on:
      - ens-gateway-mimir
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./grafana/tempo/tempo-config.yaml:/etc/tempo/tempo.yml
      - ens-gateway-tempo-data:/var/tempo
    ports:
      - "3200:3200"

  ens-gateway-grafana:
    image: "grafana/grafana:13.2.0"
    container_name: ens-gateway-grafana
    depends_on:
      - ens-gateway-mimir
      - ens-gateway-loki
      - ens-gateway-tempo
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      # Local dev only; this stack is not meant to be exposed.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      MIMIR_URL: "http://ens-gateway-mimir:9009"
      LOKI_URL: "http://ens-gateway-loki:3100"
      TEMPO_URL: "http://ens-gateway-tempo:3200"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  ens-gateway-mimir-data:
  ens-gateway-loki-data:
  ens-gateway-tempo-data:
